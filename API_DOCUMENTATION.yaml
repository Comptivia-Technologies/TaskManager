openapi: 3.0.3
info:
  title: Task Management & Workflow Orchestration API
  description: |
    Comprehensive Task Management System with Generic Workflow Orchestration.
    
    **Architecture**: Hybrid REST + Event-driven microservices
    
    **Key Features**:
    - Workflow creation and management
    - Team and member management
    - Task assignment and tracking
    - Stage-based orchestration (Process & Escalation workflows)
    - Automatic reassignment when stages change teams
    - SLA configuration with dynamic priority levels
    - Automated task orchestration (workflow selection, SLA configuration, member assignment)
    - Workload-based task assignment
    - Priority rule engine with condition-based evaluation
    
    **All endpoints are routed through API Gateway (Port 5004)**
  version: 3.1.0
  contact:
    name: API Support
    email: support@workflowautomation.enginuo.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:5004/api
    description: Local Development (API Gateway)
  - url: https://api.workflowautomation.enginuo.com/api
    description: Production (API Gateway)

tags:
  - name: Teams
    description: Team management operations
  - name: Members
    description: Member management operations
  - name: Workflows
    description: Workflow management operations
  - name: Stages
    description: Stage management operations
  - name: Tasks
    description: Task CRUD operations (WorkflowManagement.API)
  - name: TaskService
    description: Task orchestration and lifecycle management (TaskService)
  - name: SLA
    description: SLA configuration management
  - name: PriorityRules
    description: Priority rule management
  - name: Workload
    description: Workload queries
  - name: Auth
    description: Auth proxy (organization users, tenant lookup; gateway adds tenant_id from JWT)

paths:
  # Auth (API Gateway proxy to external Auth service)
  /auth/organizationuser:
    get:
      tags: [Auth]
      summary: Get active organization users
      description: |
        Returns active users for the current product and tenant.
        **product_id** is passed as query parameter (from frontend env REACT_APP_PRODUCT_ID).
        **tenant_id** is added by the gateway from the JWT (claim tenant_id or firebase.tenant).
        Gateway proxies to Auth service: GET {AuthService:BaseUrl}/api/organizationuser?product_id=...&tenant_id=...
        Used by Users page, Members page, and Workflow Wizard for loading Product Hub users.
        Requires Bearer token.
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID (e.g. from REACT_APP_PRODUCT_ID)
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUsersResponse'
        '400':
          description: Missing product_id or tenant_id could not be determined from token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (valid Bearer token required)

  # Teams
  /teams:
    get:
      tags: [Teams]
      summary: Get all teams
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
