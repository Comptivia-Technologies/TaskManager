      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Member updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
    delete:
      tags: [Members]
      summary: Delete member
      parameters:
        - name: id
          in: path
          required: true
          schema:
