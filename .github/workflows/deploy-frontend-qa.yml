name: Deploy Frontend to QA (S3 + CloudFront)

on:
  push:
    branches:
      - qa
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: qa.workflowautomation.enginuo.com
  CLOUDFRONT_DISTRIBUTION_ID: E2FZCABSWJ9XF3
  API_URL: https://qa.api.workflowautomation.enginuo.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/workflow/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/workflow
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend/workflow
        env:
          REACT_APP_API_URL: ${{ env.API_URL }}
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/workflow/build/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "asset-manifest.json"
          
          aws s3 cp frontend/workflow/build/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          
          aws s3 cp frontend/workflow/build/asset-manifest.json s3://${{ env.S3_BUCKET }}/asset-manifest.json \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Frontend deployed to QA successfully"
          echo "S3 Bucket: ${{ env.S3_BUCKET }}"
          echo "CloudFront: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "API URL: ${{ env.API_URL }}"
