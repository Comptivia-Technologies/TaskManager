name: Deploy Backend to QA (ECS)

on:
  push:
    branches:
      - qa
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 798277642170.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: workflow-automation-cluster
  TASK_EXECUTION_ROLE: arn:aws:iam::798277642170:role/workflow-automation-ecsTaskExecutionRole
  TASK_ROLE: arn:aws:iam::798277642170:role/workflow-automation-eventBridgeSchedulerRole
  DB_HOST: ep-lucky-haze-a12q0wll-pooler.ap-southeast-1.aws.neon.tech
  DB_NAME: neondb
  DB_USER: neondb_owner
  CORS_ORIGIN: https://qa.workflowautomation.enginuo.com
  AUTH_SERVICE_BASE_URL: https://qa.api.product-hub.comptivia.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        working-directory: ./backend
        run: |
          SERVICES=(
            "APIGateway:task-manager-api-gateway:5004"
            "TaskService:task-manager-task-service:5005"
            "WorkflowService:task-manager-workflow-service:5006"
            "SLAManagerService:task-manager-sla-manager-service:5007"
            "WorkloadService:task-manager-workload-service:5008"
            "PriorityRuleEngine.API:task-manager-priority-rule-engine-api:5010"
            "WorkflowManagement.API:task-manager-workflow-management-api:5000"
            "SLAConfiguration.API:task-manager-sla-configuration-api:5002"
            "Workload.API:task-manager-workload-api:5003"
          )
          
          for service in "${SERVICES[@]}"; do
            IFS=':' read -r service_dir image_name port <<< "$service"
            echo "Building $service_dir..."
            docker build -f $service_dir/Dockerfile -t $image_name .
            docker tag $image_name:latest $ECR_REGISTRY/$image_name:latest
            docker push $ECR_REGISTRY/$image_name:latest
          done

      - name: Deploy to ECS (QA)
        working-directory: ./backend
        env:
          DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          ROLES_API_KEY: ${{ secrets.ROLES_API_KEY }}
        run: |
          # Format: service_dir:family_name:container_name:port:db_name:ecs_service_name
          SERVICES=(
            "APIGateway:task-manager-api-gateway:api-gateway:5004::task-manager-api-gateway-qa"
            "TaskService:task-manager-task-service:task-service:5005:TaskService:task-manager-task-service-qa"
            "WorkflowService:task-manager-workflow-service:workflow-service:5006:WorkflowManagement:task-manager-workflow-service-qa"
            "SLAManagerService:task-manager-sla-manager-service:sla-manager-service:5007:WorkflowManagement:task-manager-sla-manager-service-qa"
            "WorkloadService:task-manager-workload-service:workload-service:5008:WorkflowManagement:task-manager-workload-service-qa"
            "PriorityRuleEngine.API:task-manager-priority-rule-engine-api:priority-api:5010:PriorityRuleEngine:task-manager-priority-rule-engine-api-qa"
            "WorkflowManagement.API:task-manager-workflow-management-api:workflow-api:5000:WorkflowManagement:task-manager-workflow-management-api-qa"
            "SLAConfiguration.API:task-manager-sla-configuration-api:sla-api:5002:WorkflowManagement:task-manager-sla-configuration-api-qa"
            "Workload.API:task-manager-workload-api:workload-api:5003:WorkflowManagement:task-manager-workload-api-qa"
          )
          
          for service in "${SERVICES[@]}"; do
            IFS=':' read -r service_dir family_name container_name port db_name actual_service_name <<< "$service"
            
            if [ -z "$db_name" ]; then
              db_name="WorkflowManagement"
            fi
            
            ENV_JSON=$(jq -n '[{"name":"ASPNETCORE_URLS","value":"http://+:80"}]')
            
            if [ "$service_dir" = "APIGateway" ]; then
              ENV_JSON=$(echo "$ENV_JSON" | jq --arg authUrl "$AUTH_SERVICE_BASE_URL" '. += [
                {"name":"ReverseProxy__Clusters__workflow-cluster__Destinations__destination1__Address","value":"http://task-manager-workflow-management-api-qa.workflow-automation:80"},
                {"name":"ReverseProxy__Clusters__sla-cluster__Destinations__destination1__Address","value":"http://task-manager-sla-configuration-api-qa.workflow-automation:80"},
                {"name":"ReverseProxy__Clusters__priority-cluster__Destinations__destination1__Address","value":"http://task-manager-priority-rule-engine-api-qa.workflow-automation:80"},
                {"name":"ReverseProxy__Clusters__workload-cluster__Destinations__destination1__Address","value":"http://task-manager-workload-api-qa.workflow-automation:80"},
                {"name":"ReverseProxy__Clusters__task-service-cluster__Destinations__destination1__Address","value":"http://task-manager-task-service-qa.workflow-automation:80"},
                {"name":"TaskServiceApi__BaseUrl","value":"http://task-manager-task-service-qa.workflow-automation/api"},
                {"name":"WorkflowManagementApi__BaseUrl","value":"http://task-manager-workflow-management-api-qa.workflow-automation/api"},
                {"name":"AuthService__BaseUrl","value":$authUrl}
              ]')
            fi
            
            ENV_JSON=$(echo "$ENV_JSON" | jq ". += [
              {\"name\":\"EVENTBUS_PROVIDER\",\"value\":\"AWS\"},
              {\"name\":\"EventBus__AWS__Region\",\"value\":\"ap-south-1\"},
              {\"name\":\"EventBus__AWS__EventBusName\",\"value\":\"work-flow-bus\"},
              {\"name\":\"EventBus__AWS__ServicePrefix\",\"value\":\"task-manager\"},
              {\"name\":\"EventBus__AWS__VisibilityTimeoutSeconds\",\"value\":\"300\"},
              {\"name\":\"EventBus__AWS__MaxReceiveCount\",\"value\":\"3\"},
              {\"name\":\"EventBus__AWS__SchedulerGroupName\",\"value\":\"task-manager-schedules\"},
              {\"name\":\"EventBus__AWS__SchedulerRoleArn\",\"value\":\"$TASK_ROLE\"},
              {\"name\":\"Cors__AllowedOrigin\",\"value\":\"$CORS_ORIGIN\"},
              {\"name\":\"DB_HOST\",\"value\":\"$DB_HOST\"},
              {\"name\":\"DB_PORT\",\"value\":\"5432\"},
              {\"name\":\"DB_USER\",\"value\":\"$DB_USER\"},
              {\"name\":\"DB_PASSWORD\",\"value\":\"$DB_PASSWORD\"},
              {\"name\":\"DB_NAME\",\"value\":\"$DB_NAME\"}
            ]")
            
            if [ "$service_dir" = "TaskService" ]; then
              ENV_JSON=$(echo "$ENV_JSON" | jq '. += [
                {"name":"WorkflowManagementApi__BaseUrl","value":"http://task-manager-workflow-management-api-qa.workflow-automation/api"}
              ]')
            fi
            
            if [ "$service_dir" = "WorkflowService" ]; then
              ENV_JSON=$(echo "$ENV_JSON" | jq '. += [
                {"name":"TaskServiceApi__BaseUrl","value":"http://task-manager-task-service-qa.workflow-automation/api"}
              ]')
            fi
            
            if [ "$service_dir" = "WorkflowManagement.API" ]; then
              ENV_JSON=$(echo "$ENV_JSON" | jq --arg apiKey "$ROLES_API_KEY" '. += [
                {"name":"ApiKeys__GetAllRoles","value":$apiKey}
              ]')
            fi
            
            jq -n \
              --arg family "$family_name" \
              --arg executionRole "$TASK_EXECUTION_ROLE" \
              --arg taskRole "$TASK_ROLE" \
              --arg containerName "$container_name" \
              --arg image "$ECR_REGISTRY/$family_name:latest" \
              --argjson envVars "$ENV_JSON" \
              --arg logGroup "/ecs/$family_name" \
              --arg logRegion "$AWS_REGION" \
              '{
                family: $family,
                networkMode: "awsvpc",
                requiresCompatibilities: ["FARGATE"],
                cpu: "256",
                memory: "512",
                executionRoleArn: $executionRole,
                taskRoleArn: $taskRole,
                containerDefinitions: [{
                  name: $containerName,
                  image: $image,
                  essential: true,
                  portMappings: [{ containerPort: 80, protocol: "tcp" }],
                  environment: $envVars,
                  logConfiguration: {
                    logDriver: "awslogs",
                    options: {
                      "awslogs-group": $logGroup,
                      "awslogs-region": $logRegion,
                      "awslogs-stream-prefix": "ecs"
                    }
                  }
                }]
              }' > task-def-$family_name.json
            
            if ! python3 -m json.tool task-def-$family_name.json > /dev/null 2>&1; then
              echo "ERROR: Invalid JSON for $family_name"
              cat task-def-$family_name.json
              exit 1
            fi
            
            echo "Registering task definition: $family_name"
            aws ecs register-task-definition --cli-input-json file://task-def-$family_name.json --region $AWS_REGION
            
            echo "Updating QA service: $actual_service_name"
            aws ecs update-service \
              --cluster $ECS_CLUSTER \
              --service $actual_service_name \
              --task-definition $family_name \
              --region $AWS_REGION \
              --force-new-deployment
          done
